<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Search – Private File Search on Your Device</title>
<style>
:root{
  --page:#eef2f9;
  --card-a:#0b1d2a; --card-b:#07121e;
  --white:#ffffff; --blue:#5aaef0; --blue-soft:#7cc0f5;
  --muted:#5f7a93;
  --green:#3ddc84; --green-bg:rgba(61,220,132,.10); --green-bd:rgba(61,220,132,.35);
  --amber:#f5b82e; --amber-bg:rgba(245,184,46,.10); --amber-bd:rgba(245,184,46,.38);
  --red:#f0584f; --red-bg:rgba(240,88,79,.10); --red-bd:rgba(240,88,79,.38);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--page:#0a0f17}
}
:root[data-theme="dark"]{--page:#0a0f17}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{
  background:var(--page);
  font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.card{
  position:relative;overflow:hidden;
  width:100%;max-width:427px;aspect-ratio:427/285;min-height:285px;
  border-radius:22px;
  background:
    radial-gradient(120% 90% at 20% 0%,rgba(30,90,110,.28),transparent 60%),
    linear-gradient(160deg,var(--card-a),var(--card-b));
  box-shadow:0 8px 28px rgba(8,20,40,.28);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 16px;text-align:center;
}
.card::before{ /* faint light streak */
  content:"";position:absolute;left:-10%;right:-10%;top:18%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(90,174,240,.25),transparent);
  transform:rotate(-3deg);
}
.dot{position:absolute;border-radius:50%;opacity:.55}
.logo{display:flex;align-items:center;gap:12px;position:relative}
.icon{
  width:42px;height:42px;border-radius:50%;display:block;
  box-shadow:0 0 14px rgba(59,130,214,.35);
}
.brand{font-size:28px;font-weight:700;letter-spacing:-.02em;color:var(--white)}
.brand span{color:var(--blue)}
.tagline{margin:18px 0 0;font-size:18px;font-weight:700;color:var(--blue-soft);letter-spacing:-.005em}
.chips{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border-radius:10px;border:1px solid;
  font-size:12px;font-weight:600;
}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.g{color:var(--green);background:var(--green-bg);border-color:var(--green-bd)}
.a{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd)}
.r{color:var(--red);background:var(--red-bg);border-color:var(--red-bd)}
.sub{margin:20px 0 0;font-size:11px;color:var(--muted)}
@media (max-width:380px){
  .brand{font-size:24px}.tagline{font-size:16px}
}
</style>
</head>
<body>
<main class="card" aria-label="Smart Search">
  <span class="dot" style="left:11%;top:16%;width:5px;height:5px;background:#2f6b5a"></span>
  <span class="dot" style="left:6%;top:42%;width:4px;height:4px;background:#2f8a62"></span>
  <span class="dot" style="left:9%;top:68%;width:4px;height:4px;background:#8a6a2f"></span>
  <span class="dot" style="left:63%;top:21%;width:6px;height:6px;background:#2f5a8a"></span>
  <span class="dot" style="left:85%;top:26%;width:3px;height:3px;background:#2f5a8a"></span>
  <span class="dot" style="left:27%;top:80%;width:4px;height:4px;background:#2f5a6a"></span>
  <span class="dot" style="left:87%;top:83%;width:3px;height:3px;background:#2f5a6a"></span>

  <div class="logo">
    <img class="icon" src="../public/assets/images/page-agent-128-no-bg.png" alt="" aria-hidden="true">
    <div class="brand">Smart<span>Search</span></div>
  </div>

  <h1 class="tagline">Find Any File by Describing It</h1>

  <div class="chips">
    <span class="chip g"><i></i>Text, images &amp; PDFs</span>
    <span class="chip a"><i></i>Audio &amp; video</span>
    <span class="chip r"><i></i>Ask your files</span>
  </div>

  <p class="sub">Indexed and searched on your device. Nothing is uploaded.</p>
</main>
</body>
</html>
